---
# Pulled by kayobe as a git source, the same way it pulls ansible-collection-cephadm.
namespace: underknowledge
name: ceph_rgw
version: 0.3.0
readme: README.md
authors:
  - Underknowledge
description: >-
  Multi-tenant S3 with OIDC federation on cephadm-deployed Ceph RGW. rgw_sts enables STS,
  rgw_tenants creates one RGW account per tenant with its users, OIDC provider, quota and
  buckets, and rgw_iam manages the IAM roles users assume from grants in an OIDC claim.
license:
  - Apache-2.0
tags:
  - storage
  - security
  - ceph
  - rgw
  - s3
  - sts
  - oidc
  - multitenancy
  - kayobe
  - cephadm
repository: https://github.com/EODC-GmbH/ansible-collection-ceph-rgw
issues: https://github.com/EODC-GmbH/ansible-collection-ceph-rgw/issues
build_ignore:
  - examples
  - .git
  - "*.tar.gz"
  - "__pycache__"
  - "*.pyc"
