---
argument_specs:
  main:
    short_description: Provision OIDC-federated, per-tenant S3 on Ceph RGW.
    description:
      - Creates an RGW account, account-root user, OIDC provider and buckets per tenant.
        Run after rgw_sts and before rgw_iam.
    options:
      rgw_tenants_endpoint:
        type: str
        required: false
        description: RGW S3/IAM/STS endpoint reachable from rgw_tenants_api_host.
      rgw_tenants_api_host:
        type: str
        required: false
        default: localhost
        description: >-
          Host that runs the boto3 steps (OIDC providers, buckets). Its Python needs boto3;
          it needs no Ceph tooling.
      rgw_tenants_validate_certs:
        type: bool
        required: false
        default: true
        description: Verify the TLS certificate of rgw_tenants_endpoint.
      rgw_tenants_ca_bundle:
        type: str
        required: false
        default: ""
        description: PEM CA bundle on rgw_tenants_api_host for rgw_tenants_endpoint. Overrides rgw_tenants_validate_certs.
      rgw_tenants_dir:
        type: str
        required: false
        default: ""
        description: Control-host directory of drop-in tenant files, appended to rgw_tenants_list. Empty disables it.
      rgw_tenants_s3_region:
        type: str
        required: false
        default: us-east-1
        description: SigV4 signing region. Does not affect bucket placement.
      rgw_tenants_default_quota:
        type: dict
        required: false
        description: Storage quota for tenants without their own. {} leaves them unlimited.
      rgw_tenants_list:
        type: list
        elements: dict
        required: false
        description: The tenants to provision.
        options:
          name:
            type: str
            required: true
            description: Tenant slug, [a-z0-9][a-z0-9-]*, at most 55 chars.
          account_id:
            type: str
            required: true
            description: RGW account id, "RGW" + 17 digits.
          state:
            type: str
            required: false
            default: present
            choices: [present, absent]
            description: absent decommissions the tenant (gated by rgw_tenants_allow_teardown).
          buckets:
            type: list
            elements: str
            required: false
            description: Bucket names to create; each must start with bucket_prefix.
          purge_objects:
            type: bool
            required: false
            default: false
            description: With state=absent, also delete data. Needs rgw_tenants_allow_purge.
          rotate_keys:
            type: bool
            required: false
            default: false
            description: Per-tenant rgw_tenants_rotate_keys.
          access_keys: &access_keys
            type: list
            elements: dict
            required: false
            description: Further keys of the user (on the tenant, its primary account-root user), each present (vaulted pair) or absent (access key only).
            options:
              access_key: {type: str, required: true, no_log: true, description: Access key id.}
              secret_key: {type: str, required: false, no_log: true, description: Secret key. Required when present.}
              state: {type: str, required: false, default: present, choices: [present, absent], description: absent removes the key.}
          limits:
            type: dict
            required: false
            description: Entity ceilings (max_users, max_roles, ...), merged over rgw_iam_account_limits. Used by rgw_iam.
          quota:
            type: dict
            required: false
            description: Storage cap. Omit for rgw_tenants_default_quota.
            options:
              enabled:
                type: bool
                required: false
                default: false
                description: Whether the quota is enforced.
              max_size:
                type: raw
                required: false
                default: -1
                description: Max bytes (or -1 = unlimited).
              max_objects:
                type: raw
                required: false
                default: -1
                description: Max object count (or -1 = unlimited).
          root_user:
            type: str
            required: false
            description: Primary account-root uid, [a-z0-9_-]. Default "<name>root".
          bucket_prefix:
            type: str
            required: false
            description: Prefix every bucket of this tenant must carry. Default "<name>-".
          roles:
            type: list
            elements: dict
            required: false
            description: Extra IAM roles for this tenant on top of the global catalogue. Used by rgw_iam.
            options:
              name:
                type: str
                required: true
                description: Role name within the tenant; the IAM role is "<tenant>-<name>".
              capabilities:
                type: list
                elements: str
                required: true
                description: Names from rgw_iam_capabilities.
              buckets:
                type: list
                elements: str
                required: false
                description: Narrow the role to these buckets; the default is every bucket of the tenant.
              prefixes:
                type: list
                elements: str
                required: false
                description: Narrow the role to these object key prefixes, with a matching s3:prefix condition.
          session_duration:
            type: int
            required: false
            description: Session lifetime in seconds for this tenant's roles, 3600..43200. Used by rgw_iam.
          root_users:
            type: list
            elements: dict
            required: false
            description: Additional account-root users, uid iam-<name>-root-<this.name>.
            options:
              name:
                type: str
                required: true
                description: Descriptor slug, [a-z0-9_]+ (see the ceph_descriptor filter).
              state:
                type: str
                required: false
                default: present
                choices: [present, absent]
                description: absent removes the user, gated by rgw_tenants_allow_root_user_removal.
              suspended:
                type: bool
                required: false
                default: false
                description: Suspend the user, keeping its keys.
              access_keys: *access_keys
          users:
            type: list
            elements: dict
            required: false
            description: Static-key service users, uid iam-<name>-svc-<this.name>. rgw_iam sets their policy.
            options:
              name:
                type: str
                required: true
                description: Descriptor slug, [a-z0-9_]+.
              capabilities:
                type: list
                elements: str
                required: true
                description: Names from rgw_iam_capabilities. Delegated-IAM capabilities are refused.
              buckets:
                type: list
                elements: str
                required: false
                description: Narrow to these buckets. Default every bucket of the tenant.
              prefixes:
                type: list
                elements: str
                required: false
                description: Narrow to these object key prefixes, with a matching s3:prefix condition.
              state:
                type: str
                required: false
                default: present
                choices: [present, absent]
                description: absent removes the user and its keys.
              suspended:
                type: bool
                required: false
                default: false
                description: Suspend the user, keeping its keys.
              access_keys: *access_keys
      rgw_tenants_oidc:
        type: dict
        required: false
        description: The OIDC realm to federate.
        options:
          provider_url:
            type: str
            required: true
            description: Token issuer URL (the JWT iss), no trailing slash.
          client_ids:
            type: list
            elements: str
            required: true
            description: Accepted audiences (the RGW-facing OIDC client id(s)).
          thumbprints:
            type: list
            elements: str
            required: true
            description: SHA1 hex (40 chars) of the JWKS signing cert.
      rgw_tenants_rotate_keys:
        type: bool
        required: false
        default: false
        description: Gate for rolling every tenant's user S3 keys (account-root, additional root, service) to the vaulted values.
      rgw_tenants_limit:
        type: list
        elements: str
        required: false
        default: []
        description: >-
          Names of the tenants a run reconciles (provision and teardown); empty means all.
          Every tenant is still validated and counts as managed for discover, report and
          verify. A name no tenant has stops the run.
      rgw_tenants_allow_teardown:
        type: bool
        required: false
        default: false
        description: Gate for the state=absent decommission path.
      rgw_tenants_allow_purge:
        type: bool
        required: false
        default: false
        description: Gate for a tenant's purge_objects.
      rgw_tenants_allow_root_user_removal:
        type: bool
        required: false
        default: true
        description: Remove root_users marked state=absent (buckets are account-owned and kept).
      rgw_tenants_bootstrap_host:
        type: str
        required: false
        description: Host that runs the ceph commands (default groups['mons'][0]).
      rgw_tenants_fsid:
        type: str
        required: false
        description: Cluster fsid for the modules. Empty reads it from /etc/ceph/ceph.conf.
      rgw_tenants_report:
        type: bool
        required: false
        default: false
        description: Print each tenant's usage against its quota, then end the play.
      rgw_tenants_discover:
        type: bool
        required: false
        default: false
        description: Read-only. List RGW accounts, write an adoption stub per unmanaged one, end the play.
      rgw_tenants_discover_output_dir:
        type: str
        required: false
        description: Directory for discovery stubs. Default "{{ playbook_dir }}/rgw-tenants-discovery".
