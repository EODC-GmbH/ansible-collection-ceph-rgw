galaxy_info:
  role_name: rgw_tenants
  namespace: underknowledge
  author: Underknowledge
  description: OIDC-federated, per-tenant S3 on Ceph RGW (accounts, roles, OIDC providers, buckets).
  license: Apache-2.0
  min_ansible_version: "2.15"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble
    - name: EL
      versions:
        - "9"
  galaxy_tags:
    - ceph
    - rgw
    - s3
    - oidc
    - keycloak
    - multitenancy
# rgw_sts must run first, in its own play, so its RGW restart lands between the two. Listing it as a
# dependency would run it inline a second time instead; the cephadm play chain does the ordering.
dependencies: []
