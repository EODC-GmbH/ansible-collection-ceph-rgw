---
# rgw_tenants: one RGW account per tenant, its account-root user(s), quota, OIDC
# provider and buckets. Run after rgw_sts and before rgw_iam, which owns the IAM
# roles assumed inside these accounts.

# Host owning the cephadm bootstrap keyring; all radosgw-admin/ceph work runs there.
rgw_tenants_bootstrap_host: "{{ groups['mons'][0] }}"
# Cluster fsid, forwarded to every module. Empty => read from /etc/ceph/ceph.conf.
rgw_tenants_fsid: ""

# Control-host directory of drop-in tenant files. Every *.yml/*.yaml in it is loaded and
# each rgw_tenant_<name> dict appended to rgw_tenants_list; a drop-in overrides an inline
# entry of the same name. playbooks/rgw_new_tenant.yml writes one. Empty => not loaded.
rgw_tenants_dir: ""

# Read-only discovery: list every RGW account, mark it managed or unmanaged against
# rgw_tenants_list, write an adoption stub per unmanaged account, end the play.
rgw_tenants_discover: false
rgw_tenants_discover_output_dir: "{{ playbook_dir }}/rgw-tenants-discovery"

# Read-only usage report against each account's quota, then end the play. Uses cached
# account stats (no --sync-stats).
rgw_tenants_report: false

# Gates for the destructive paths, so a scheduled converge never takes them.
#
# Roll every tenant's account-root S3 keys to the current vaulted value. Rotates only on
# drift, so it is idempotent while on.
rgw_tenants_rotate_keys: false
# Run the state: absent decommission path at all. Off => absent entries are reported
# and skipped, so a committed `state: absent` never deletes a tenant unattended.
rgw_tenants_allow_teardown: false
# Second gate: a tenant's purge_objects takes effect only when this is also true.
# Without it a non-empty bucket or account fails the run instead of being destroyed.
rgw_tenants_allow_purge: false
# Honor a root_users entry marked state: absent. On by default because buckets are owned
# by the account, not the uid, so removing a root user destroys no data.
rgw_tenants_allow_root_user_removal: true

# cephadm RGW service restarted after an OIDC provider change (RGW caches the provider
# in memory). Check `ceph orch ls --service-type rgw` if it is not literally rgw.rgw.
rgw_tenants_service_name: "rgw.rgw"

# RGW S3/IAM endpoint the bootstrap host can reach, e.g. http://<rgw-vip>:8080.
rgw_tenants_endpoint: ""

# TLS verification for the boto3 calls (OIDC providers, buckets) against
# rgw_tenants_endpoint. A public-CA certificate needs neither. For a private CA, point
# rgw_tenants_ca_bundle at a PEM file on the bootstrap host instead of turning
# verification off.
rgw_tenants_validate_certs: true
rgw_tenants_ca_bundle: ""

# SigV4 signing region only. CreateBucketConfiguration is never sent, so RGW places
# buckets in the endpoint's zonegroup whatever this says.
rgw_tenants_s3_region: "us-east-1"

# Fallback quota for tenants that omit their own. Same shape as a tenant quota.
# {} => such tenants stay at RGW's unlimited default.
rgw_tenants_default_quota: {}

# The tenants. Each item:
#   name           tenant slug, [a-z0-9-]; account-root uid stem and default bucket prefix
#   account_id     "RGW" + 17 digits, unique and stable (every role ARN derives from it)
#   state          present (default) or absent (decommission; keep the entry until torn down)
#   buckets        bucket names to create as account-root
#   bucket_prefix  prefix every bucket of this tenant must carry, asserted (default "<name>-")
#   quota          storage cap {enabled, max_size (bytes or -1), max_objects (count or -1)}
#   root_user      primary account-root uid (default "<name>root")
#   root_users     extra account-root users [{name, state, suspended}] -> iam-<name>-root-<slug>
#   users          static-key service users [{name, state, suspended, capabilities, ...}]
#                  -> iam-<name>-svc-<slug>; rgw_iam puts their policy
#   rotate_keys    per-tenant rgw_tenants_rotate_keys
#   purge_objects  with state: absent, allow destroying data (also needs rgw_tenants_allow_purge)
#
# rgw_iam reads limits, roles and session_duration off the same entry. They are declared
# in this role's argument_specs too, since whichever role loads an entry validates it.
rgw_tenants_list: []

# The OIDC realm to federate. One provider is registered per tenant account.
#   provider_url  token issuer incl. https:// (matches the JWT iss), no trailing slash
#   client_ids    accepted audiences (the RGW-facing OIDC client id(s))
#   thumbprints   SHA1 hex of the JWKS signing cert (use=sig x5c), NOT the TLS chain
rgw_tenants_oidc:
  provider_url: ""
  client_ids: []
  thumbprints: []
