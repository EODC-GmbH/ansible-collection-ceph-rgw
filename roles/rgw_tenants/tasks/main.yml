---
- name: Load the tenant drop-ins
  ansible.builtin.include_tasks: load_tenants.yml

# Runs before validation so it works on a cluster with no tenants or OIDC configured yet.
- name: Discover existing RGW accounts
  ansible.builtin.include_tasks: discover.yml
  when:
    - rgw_tenants_discover | bool
    - inventory_hostname == rgw_tenants_bootstrap_host

- name: End the play after discovery
  ansible.builtin.meta: end_play
  when: rgw_tenants_discover | bool

# A misspelt name would otherwise reconcile nothing and report success.
- name: Refuse a limit naming an unknown tenant
  ansible.builtin.assert:
    quiet: true
    that:
      - rgw_tenants_limit is not string
      - _rgw_tenants_unknown | length == 0
    fail_msg: >-
      {% if rgw_tenants_limit is string %}rgw_tenants_limit must be a list of tenant names,
      as in -e '{"rgw_tenants_limit": ["{{ rgw_tenants_limit }}"]}'.
      {% else %}rgw_tenants_limit names {{ _rgw_tenants_unknown }}, which no drop-in or
      rgw_tenants_list entry declares.{% endif %}
  vars:
    _rgw_tenants_unknown: "{{ rgw_tenants_limit | difference(rgw_tenants_list | map(attribute='name')) }}"
  when: rgw_tenants_limit | length > 0

# Computed on every host so the loop expressions stay defined where the bootstrap-host
# `when` skips their tasks. rgw_tenants_limit narrows both; validation above saw all.
- name: Partition tenants into present and absent
  ansible.builtin.set_fact:
    _rgw_tenants_present: >-
      {{ (_rgw_tenants_selected | rejectattr('state', 'defined') | list)
         + (_rgw_tenants_selected | selectattr('state', 'defined')
            | rejectattr('state', 'equalto', 'absent') | list) }}
    _rgw_tenants_absent: >-
      {{ _rgw_tenants_selected | selectattr('state', 'defined')
         | selectattr('state', 'equalto', 'absent') | list }}
  vars:
    _rgw_tenants_selected: >-
      {{ (rgw_tenants_list | selectattr('name', 'in', rgw_tenants_limit) | list)
         if rgw_tenants_limit | length > 0 else rgw_tenants_list }}

- name: Validate tenant configuration
  ansible.builtin.assert:
    quiet: true
    that:
      - rgw_tenants_endpoint | length > 0
      - rgw_tenants_oidc.provider_url | length > 0
      - rgw_tenants_oidc.thumbprints | length > 0
      - rgw_tenants_oidc.thumbprints | reject('match', '^[0-9a-fA-F]{40}$') | list | length == 0
    fail_msg: >-
      rgw_tenants_endpoint and rgw_tenants_oidc.provider_url must be set, and every
      thumbprint must be a 40-hex SHA1 of the JWKS signing cert (not the CHANGEME placeholder).
      See the role README for how to compute it.
  when:
    - rgw_tenants_list | length > 0
    - not (rgw_tenants_report | default(false) | bool)
    - inventory_hostname == rgw_tenants_bootstrap_host

# No underscore in a tenant name: IAM roles are named <tenant>-<role>, and RGW checks a
# role name against both rgw_rest_iam.cc's [\w+=,.@-]+ and rgw_role.cc's
# [A-Za-z0-9:=,.@-]+, whose intersection has no underscore. 55 characters leaves room for
# a role suffix under RGW's MAX_ROLE_NAME_LEN of 64. \Z, not $: Python's $ also matches
# before a trailing newline, which a YAML block scalar would carry.
- name: Validate each tenant entry
  ansible.builtin.assert:
    quiet: true
    that:
      - item.name is match('^[a-z0-9][a-z0-9-]*\Z')
      - item.name | length <= 55
      - item.account_id is match('^RGW[0-9]{17}\Z')
      - (item.root_user | default(item.name ~ 'root')) is match('^[a-z0-9][a-z0-9_-]*\Z')
      - lookup('vars', 'vault_rgw_tenants_' ~ (item.name | replace('-', '_')) ~ '_access_key', default='') | length > 0
      - lookup('vars', 'vault_rgw_tenants_' ~ (item.name | replace('-', '_')) ~ '_secret_key', default='') | length > 0
      - item.buckets | default([]) | reject('match', '^' ~ (item.bucket_prefix | default(item.name ~ '-') | regex_escape)) | list | length == 0
      - item.buckets | default([]) | reject('match', '^[a-z0-9][a-z0-9.-]{2,62}\Z') | list | length == 0
    fail_msg: >-
      tenant '{{ item.name }}' is invalid: name must be lowercase [a-z0-9-] and at most
      55 characters (no underscore: RGW rejects one in the <tenant>-<role> IAM role
      name), root_user [a-z0-9_-], account_id RGW+17 digits,
      vault_rgw_tenants_{{ item.name | replace('-', '_') }}_access_key/_secret_key must be defined, and every
      bucket must be a valid S3 name starting with the prefix
      '{{ item.bucket_prefix | default(item.name ~ '-') }}'.
  loop: "{{ rgw_tenants_list }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not (rgw_tenants_report | default(false) | bool)
    - inventory_hostname == rgw_tenants_bootstrap_host

- name: Validate each tenant's root_users
  ansible.builtin.assert:
    quiet: true
    that:
      - item.1.name is match('^[a-z0-9][a-z0-9_]*\Z')
      - (item.1.state | default('present')) in ['present', 'absent']
      - (item.1.state | default('present')) == 'absent'
        or lookup('vars', 'vault_rgw_tenants_' ~ (item.0.name | replace('-', '_')) ~ '_root_' ~ item.1.name ~ '_access_key', default='') | length > 0
      - (item.1.state | default('present')) == 'absent'
        or lookup('vars', 'vault_rgw_tenants_' ~ (item.0.name | replace('-', '_')) ~ '_root_' ~ item.1.name ~ '_secret_key', default='') | length > 0
    fail_msg: >-
      tenant '{{ item.0.name }}' root_user '{{ item.1.name }}' is invalid:
      name must be [a-z0-9_], state present|absent, and (when present)
      vault_rgw_tenants_{{ item.0.name | replace('-', '_') }}_root_{{ item.1.name }}_access_key/_secret_key must be defined.
  loop: "{{ rgw_tenants_list | subelements('root_users', skip_missing=true) }}"
  loop_control:
    label: "{{ item.0.name }}/{{ item.1.name }}"
  when:
    - not (rgw_tenants_report | default(false) | bool)
    - inventory_hostname == rgw_tenants_bootstrap_host

- name: Validate each tenant's service users
  ansible.builtin.assert:
    quiet: true
    that:
      - item.1.name is match('^[a-z0-9][a-z0-9_]*\Z')
      - ('iam-' ~ item.0.name ~ '-svc-' ~ item.1.name) | length <= 64
      - (item.1.state | default('present')) in ['present', 'absent']
      - (item.1.state | default('present')) == 'absent'
        or lookup('vars', 'vault_rgw_tenants_' ~ (item.0.name | replace('-', '_')) ~ '_svc_' ~ item.1.name ~ '_access_key', default='') | length > 0
      - (item.1.state | default('present')) == 'absent'
        or lookup('vars', 'vault_rgw_tenants_' ~ (item.0.name | replace('-', '_')) ~ '_svc_' ~ item.1.name ~ '_secret_key', default='') | length > 0
    fail_msg: >-
      tenant '{{ item.0.name }}' service user '{{ item.1.name }}' is invalid:
      name must be [a-z0-9_], iam-{{ item.0.name }}-svc-{{ item.1.name }} at most 64
      characters (IAM's UserName limit), state present|absent, and (when present)
      vault_rgw_tenants_{{ item.0.name | replace('-', '_') }}_svc_{{ item.1.name }}_access_key/_secret_key must be defined.
  loop: "{{ rgw_tenants_list | subelements('users', skip_missing=true) }}"
  loop_control:
    label: "{{ item.0.name }}/{{ item.1.name }}"
  when:
    - not (rgw_tenants_report | default(false) | bool)
    - inventory_hostname == rgw_tenants_bootstrap_host

# Report skips the validation above: it needs neither vault keys nor OIDC config.
- name: Report tenant usage against quota
  ansible.builtin.include_tasks: report.yml
  when:
    - rgw_tenants_report | default(false) | bool
    - inventory_hostname == rgw_tenants_bootstrap_host

- name: End the play after the report
  ansible.builtin.meta: end_play
  when: rgw_tenants_report | default(false) | bool

- name: Read rgw_s3_auth_use_sts
  underknowledge.ceph_rgw.rgw_config_info:
    options: [rgw_s3_auth_use_sts]
    fsid: "{{ rgw_tenants_fsid | default(omit, true) }}"
  register: rgw_tenants_sts_check
  become: true
  when:
    - rgw_tenants_list | length > 0
    - inventory_hostname == rgw_tenants_bootstrap_host

- name: Assert STS auth is enabled
  ansible.builtin.assert:
    quiet: true
    # Under --check, rgw_sts earlier in the same run only reports that it would set it.
    that: >-
      rgw_tenants_sts_check.config.rgw_s3_auth_use_sts == 'true'
      or (ansible_check_mode and rgw_sts_auth_reg | default({}) is changed)
    fail_msg: >-
      rgw_s3_auth_use_sts is not 'true'; run the rgw_sts role (cephadm-sts.yml) before
      rgw_tenants (cephadm-tenants.yml). See the collection README ordering note.
      Under --check, rgw_sts must run earlier in the same run on this host.
  when:
    - rgw_tenants_list | length > 0
    - inventory_hostname == rgw_tenants_bootstrap_host

# rgw_sts may have just restarted RGW, which reports running before it listens.
- name: Wait for the RGW endpoint to answer
  ansible.builtin.uri:
    url: "{{ rgw_tenants_endpoint }}"
    method: GET
    status_code: [200, 403, 405]
    validate_certs: false
  register: rgw_tenants_endpoint_reg
  until: rgw_tenants_endpoint_reg.status in [200, 403, 405]
  retries: 30
  delay: 5
  delegate_to: "{{ rgw_tenants_api_host }}"
  # Read-only, and the --check previews below need the endpoint.
  check_mode: false
  when:
    - rgw_tenants_list | length > 0
    - inventory_hostname == rgw_tenants_bootstrap_host

- name: Provision present tenants
  ansible.builtin.include_tasks: provision.yml
  when:
    - _rgw_tenants_present | length > 0
    - inventory_hostname == rgw_tenants_bootstrap_host

- name: Warn about tenants waiting on rgw_tenants_allow_teardown
  ansible.builtin.debug:
    msg: >-
      {{ _rgw_tenants_absent | map(attribute='name') | list }} marked state: absent
      but rgw_tenants_allow_teardown is false; skipping teardown.
      Re-run with -e rgw_tenants_allow_teardown=true to decommission.
  when:
    - _rgw_tenants_absent | length > 0
    - not (rgw_tenants_allow_teardown | default(false) | bool)
    - inventory_hostname == rgw_tenants_bootstrap_host

- name: Decommission absent tenants
  ansible.builtin.include_tasks: teardown.yml
  when:
    - _rgw_tenants_absent | length > 0
    - rgw_tenants_allow_teardown | default(false) | bool
    - inventory_hostname == rgw_tenants_bootstrap_host
