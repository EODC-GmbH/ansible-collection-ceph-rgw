---
# uid == display name == iam-<account>-root-<descriptor>, which the user ARN is built from.
# rotate_keys applies to these users as well as the primary root.
- name: Ensure each declared root user exists
  underknowledge.ceph_rgw.rgw_account_user:
    uid: "iam-{{ item.0.name }}-root-{{ item.1.name }}"
    account_id: "{{ item.0.account_id }}"
    access_key: "{{ lookup('vars', 'vault_rgw_tenants_' ~ (item.0.name | replace('-', '_')) ~ '_root_' ~ item.1.name ~ '_access_key') }}"
    secret_key: "{{ lookup('vars', 'vault_rgw_tenants_' ~ (item.0.name | replace('-', '_')) ~ '_root_' ~ item.1.name ~ '_secret_key') }}"
    rotate_keys: "{{ (rgw_tenants_rotate_keys | default(false) | bool) or (item.0.rotate_keys | default(false) | bool) }}"
    suspended: "{{ item.1.suspended | default(false) | bool }}"
    keys: "{{ item.1.access_keys | default([]) }}"
    fsid: "{{ rgw_tenants_fsid | default(omit, true) }}"
  loop: "{{ _rgw_tenants_present | subelements('root_users', skip_missing=true) }}"
  loop_control:
    label: "iam-{{ item.0.name }}-root-{{ item.1.name }}"
  register: _rgw_tenants_root_users_reg
  become: true
  when:
    - (item.1.state | default('present')) != 'absent'
    - inventory_hostname == rgw_tenants_bootstrap_host

# Without rotate_keys an existing user keeps its cluster keys, so vault drift would go
# unnoticed until a client gets 403. Users skipped as state: absent have no keys_match.
- name: Stop when a root user's vaulted keys do not match the cluster
  ansible.builtin.assert:
    quiet: true
    that:
      - item.keys_match | default(none) is not sameas false or 'rotated' in item.actions
      - item.keys_drift | default([]) | length == 0 or 'rotated' in item.actions
    fail_msg: >-
      {% if item.user.access_key_ids | default(['?']) | length == 0 %}iam-{{ item.item.0.name }}-root-{{ item.item.1.name }}
      holds no key on the cluster, so the vaulted pair cannot match;
      a key removed by hand is not put back on its own, in case it was revoked on purpose.
      {% else %}vault keys for iam-{{ item.item.0.name }}-root-{{ item.item.1.name }}
      do not match the cluster's
      (the primary pair, or an access_keys entry whose secret differs).{% endif %}
      Set rotate_keys: true on tenant {{ item.item.0.name }}
      to move the cluster onto the vaulted pair, or restore the previous
      vault_rgw_tenants_{{ item.item.0.name | replace('-', '_') }}_root_{{ item.item.1.name }}_access_key/_secret_key.
  loop: "{{ _rgw_tenants_root_users_reg.results | default([]) }}"
  loop_control:
    label: "iam-{{ item.item.0.name }}-root-{{ item.item.1.name }}"
  when: inventory_hostname == rgw_tenants_bootstrap_host

- name: Remove absent root users
  underknowledge.ceph_rgw.rgw_account_user:
    uid: "iam-{{ item.0.name }}-root-{{ item.1.name }}"
    account_id: "{{ item.0.account_id }}"
    state: absent
    fsid: "{{ rgw_tenants_fsid | default(omit, true) }}"
  loop: "{{ _rgw_tenants_present | subelements('root_users', skip_missing=true) }}"
  loop_control:
    label: "iam-{{ item.0.name }}-root-{{ item.1.name }}"
  become: true
  when:
    - (item.1.state | default('present')) == 'absent'
    - rgw_tenants_allow_root_user_removal | default(true) | bool
    - inventory_hostname == rgw_tenants_bootstrap_host

- name: Warn about root-user removals skipped by rgw_tenants_allow_root_user_removal
  ansible.builtin.debug:
    msg: >-
      root user iam-{{ item.0.name }}-root-{{ item.1.name }} is state: absent
      but rgw_tenants_allow_root_user_removal is false; skipping.
      Re-run with -e rgw_tenants_allow_root_user_removal=true to offboard.
  loop: "{{ _rgw_tenants_present | subelements('root_users', skip_missing=true) }}"
  loop_control:
    label: "iam-{{ item.0.name }}-root-{{ item.1.name }}"
  when:
    - (item.1.state | default('present')) == 'absent'
    - not (rgw_tenants_allow_root_user_removal | default(true) | bool)
    - inventory_hostname == rgw_tenants_bootstrap_host
