---
# uid == display name == iam-<account>-root-<descriptor>, which the user ARN is built from.
# rotate_keys applies to these users as well as the primary root.
- name: Ensure each declared root user exists
  underknowledge.ceph_rgw.rgw_account_user:
    uid: "iam-{{ item.0.name }}-root-{{ item.1.name }}"
    account_id: "{{ item.0.account_id }}"
    access_key: "{{ lookup('vars', 'vault_rgw_tenants_' ~ (item.0.name | replace('-', '_')) ~ '_root_' ~ item.1.name ~ '_access_key') }}"
    secret_key: "{{ lookup('vars', 'vault_rgw_tenants_' ~ (item.0.name | replace('-', '_')) ~ '_root_' ~ item.1.name ~ '_secret_key') }}"
    rotate_keys: "{{ (rgw_tenants_rotate_keys | default(false) | bool) or (item.0.rotate_keys | default(false) | bool) }}"
    suspended: "{{ item.1.suspended | default(false) | bool }}"
    fsid: "{{ rgw_tenants_fsid | default(omit, true) }}"
  loop: "{{ _rgw_tenants_present | subelements('root_users', skip_missing=true) }}"
  loop_control:
    label: "iam-{{ item.0.name }}-root-{{ item.1.name }}"
  become: true
  when:
    - (item.1.state | default('present')) != 'absent'
    - inventory_hostname == rgw_tenants_bootstrap_host

- name: Remove absent root users
  underknowledge.ceph_rgw.rgw_account_user:
    uid: "iam-{{ item.0.name }}-root-{{ item.1.name }}"
    account_id: "{{ item.0.account_id }}"
    state: absent
    fsid: "{{ rgw_tenants_fsid | default(omit, true) }}"
  loop: "{{ _rgw_tenants_present | subelements('root_users', skip_missing=true) }}"
  loop_control:
    label: "iam-{{ item.0.name }}-root-{{ item.1.name }}"
  become: true
  when:
    - (item.1.state | default('present')) == 'absent'
    - rgw_tenants_allow_root_user_removal | default(true) | bool
    - inventory_hostname == rgw_tenants_bootstrap_host

- name: Warn about root-user removals skipped by rgw_tenants_allow_root_user_removal
  ansible.builtin.debug:
    msg: >-
      root user iam-{{ item.0.name }}-root-{{ item.1.name }} is state: absent
      but rgw_tenants_allow_root_user_removal is false; skipping.
      Re-run with -e rgw_tenants_allow_root_user_removal=true to offboard.
  loop: "{{ _rgw_tenants_present | subelements('root_users', skip_missing=true) }}"
  loop_control:
    label: "iam-{{ item.0.name }}-root-{{ item.1.name }}"
  when:
    - (item.1.state | default('present')) == 'absent'
    - not (rgw_tenants_allow_root_user_removal | default(true) | bool)
    - inventory_hostname == rgw_tenants_bootstrap_host
