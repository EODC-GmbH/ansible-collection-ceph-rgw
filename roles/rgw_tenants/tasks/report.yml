---
# Lists every account rather than reading each tenant's: `account get` fails on an
# account that does not exist yet, which would abort the whole report.
- name: Read every account and its usage
  underknowledge.ceph_rgw.rgw_account_info:
    all: true
    stats: true
    fsid: "{{ rgw_tenants_fsid | default(omit, true) }}"
  register: _rgw_report_reg
  become: true

- name: Join usage to quota for the configured tenants
  ansible.builtin.set_fact:
    _rgw_report: >-
      {{ _rgw_report_reg.accounts
         | selectattr('id', 'in', rgw_tenants_list | map(attribute='account_id') | list)
         | list | underknowledge.ceph_rgw.ceph_usage_report(rgw_tenants_list) }}
    _rgw_report_missing: >-
      {{ rgw_tenants_list
         | rejectattr('account_id', 'in', _rgw_report_reg.accounts | map(attribute='id') | list)
         | map(attribute='name') | list }}

- name: "Usage: per tenant"
  ansible.builtin.debug:
    msg: >-
      {{ item.name }} ({{ item.account_id }}):
      size {{ (item.used_size / 1024 ** 3) | round(2) }} GiB
      {{ '/ ' ~ (item.max_size | int / 1024 ** 3) | round(2) ~ ' GiB (' ~ item.size_pct ~ '%)' if item.size_pct is not none else '/ unlimited' }};
      objects {{ item.used_objects }}
      {{ '/ ' ~ item.max_objects ~ ' (' ~ item.objects_pct ~ '%)' if item.objects_pct is not none else '/ unlimited' }}
      {{ '[quota OFF]' if not item.enabled else '' }}
  loop: "{{ _rgw_report }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Usage: tenants configured but not on the cluster"
  ansible.builtin.debug:
    msg: "no account yet: {{ _rgw_report_missing }}"
  when: _rgw_report_missing | length > 0

- name: "Usage: tenants at or over 80% of a cap"
  ansible.builtin.debug:
    msg: >-
      near/over quota (>=80%):
      {{ _rgw_report | underknowledge.ceph_rgw.ceph_over_quota | default(['none'], true) }}
