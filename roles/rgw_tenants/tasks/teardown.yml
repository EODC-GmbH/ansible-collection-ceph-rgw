---
# Steps that need the account-root keys run before that user is removed. Keep the entry
# (state: absent) until a run reports all OK, then delete it and its vault keys.

# A non-empty bucket fails the run unless both purge_objects and rgw_tenants_allow_purge
# are set. Only current object versions are purged, so a versioned bucket still fails
# with BucketNotEmpty.
- name: Remove buckets for decommissioned tenants
  underknowledge.ceph_rgw.rgw_bucket:
    names: "{{ item.buckets }}"
    state: absent
    purge_objects: "{{ (item.purge_objects | default(false) | bool) and (rgw_tenants_allow_purge | default(false) | bool) }}"
    endpoint_url: "{{ rgw_tenants_endpoint }}"
    validate_certs: "{{ rgw_tenants_validate_certs }}"
    ca_bundle: "{{ rgw_tenants_ca_bundle | default(omit, true) }}"
    region: "{{ rgw_tenants_s3_region }}"
    access_key: "{{ lookup('vars', 'vault_rgw_tenants_' ~ (item.name | replace('-', '_')) ~ '_access_key') }}"
    secret_key: "{{ lookup('vars', 'vault_rgw_tenants_' ~ (item.name | replace('-', '_')) ~ '_secret_key') }}"
  loop: "{{ _rgw_tenants_absent }}"
  loop_control:
    label: "{{ item.name }}: {{ item.buckets | default([]) | join(', ') }}"
  when:
    - item.buckets | default([]) | length > 0
    - inventory_hostname == rgw_tenants_bootstrap_host

- name: Delete the OIDC provider for decommissioned tenants
  underknowledge.ceph_rgw.rgw_oidc_provider:
    url: "{{ rgw_tenants_oidc.provider_url }}"
    state: absent
    endpoint_url: "{{ rgw_tenants_endpoint }}"
    validate_certs: "{{ rgw_tenants_validate_certs }}"
    ca_bundle: "{{ rgw_tenants_ca_bundle | default(omit, true) }}"
    region: "{{ rgw_tenants_s3_region }}"
    access_key: "{{ lookup('vars', 'vault_rgw_tenants_' ~ (item.name | replace('-', '_')) ~ '_access_key') }}"
    secret_key: "{{ lookup('vars', 'vault_rgw_tenants_' ~ (item.name | replace('-', '_')) ~ '_secret_key') }}"
  loop: "{{ _rgw_tenants_absent }}"
  loop_control:
    label: "{{ item.name }} ({{ item.account_id }})"
  when: inventory_hostname == rgw_tenants_bootstrap_host

# Read from the cluster rather than config, to catch the <name>-x-* roles a tenant minted
# itself as well as rgw_iam's.
- name: List the IAM roles of each decommissioned tenant
  underknowledge.ceph_rgw.rgw_role_info:
    account_id: "{{ item.account_id }}"
    name_prefix: "{{ item.name }}-"
    fsid: "{{ rgw_tenants_fsid | default(omit, true) }}"
  loop: "{{ _rgw_tenants_absent }}"
  loop_control:
    label: "{{ item.name }}-*"
  register: _rgw_teardown_roles
  become: true
  when: inventory_hostname == rgw_tenants_bootstrap_host

- name: Delete the IAM roles of each decommissioned tenant
  underknowledge.ceph_rgw.rgw_role:
    name: "{{ item.1.name }}"
    account_id: "{{ item.0.item.account_id }}"
    state: absent
    fsid: "{{ rgw_tenants_fsid | default(omit, true) }}"
  loop: "{{ _rgw_teardown_roles.results | default([]) | subelements('roles', skip_missing=true) }}"
  loop_control:
    label: "{{ item.1.name }}"
  become: true
  when: inventory_hostname == rgw_tenants_bootstrap_host

# account rm refuses while any user remains, so the service and root users go first.
- name: Remove service users for decommissioned tenants
  underknowledge.ceph_rgw.rgw_account_user:
    uid: "{{ item.1.name | underknowledge.ceph_rgw.rgw_service_user_name(item.0.name) }}"
    account_id: "{{ item.0.account_id }}"
    account_root: false
    state: absent
    fsid: "{{ rgw_tenants_fsid | default(omit, true) }}"
  loop: "{{ _rgw_tenants_absent | subelements('users', skip_missing=true) }}"
  loop_control:
    label: "{{ item.1.name | underknowledge.ceph_rgw.rgw_service_user_name(item.0.name) }}"
  become: true
  when: inventory_hostname == rgw_tenants_bootstrap_host

- name: Remove additional root users for decommissioned tenants
  underknowledge.ceph_rgw.rgw_account_user:
    uid: "iam-{{ item.0.name }}-root-{{ item.1.name }}"
    account_id: "{{ item.0.account_id }}"
    state: absent
    fsid: "{{ rgw_tenants_fsid | default(omit, true) }}"
  loop: "{{ _rgw_tenants_absent | subelements('root_users', skip_missing=true) }}"
  loop_control:
    label: "iam-{{ item.0.name }}-root-{{ item.1.name }}"
  become: true
  when: inventory_hostname == rgw_tenants_bootstrap_host

- name: Remove the account-root user for decommissioned tenants
  underknowledge.ceph_rgw.rgw_account_user:
    uid: "{{ item.root_user | default(item.name ~ 'root') }}"
    account_id: "{{ item.account_id }}"
    state: absent
    fsid: "{{ rgw_tenants_fsid | default(omit, true) }}"
  loop: "{{ _rgw_tenants_absent }}"
  loop_control:
    label: "{{ item.root_user | default(item.name ~ 'root') }}"
  become: true
  when: inventory_hostname == rgw_tenants_bootstrap_host

# `account rm` refuses while the account still holds anything, so leftovers the tenant
# created itself fail the run unless purge is allowed (`--purge-data`).
- name: Remove the RGW account for decommissioned tenants
  underknowledge.ceph_rgw.rgw_account:
    account_id: "{{ item.account_id }}"
    state: absent
    purge_data: "{{ (item.purge_objects | default(false) | bool) and (rgw_tenants_allow_purge | default(false) | bool) }}"
    fsid: "{{ rgw_tenants_fsid | default(omit, true) }}"
  loop: "{{ _rgw_tenants_absent }}"
  loop_control:
    label: "{{ item.name }} ({{ item.account_id }})"
  become: true
  when: inventory_hostname == rgw_tenants_bootstrap_host
