---
# Created with the tenant's account-root keys so the account owns them.
- name: Create each tenant's buckets
  underknowledge.ceph_rgw.rgw_bucket:
    names: "{{ item.buckets }}"
    endpoint_url: "{{ rgw_tenants_endpoint }}"
    validate_certs: "{{ rgw_tenants_validate_certs }}"
    ca_bundle: "{{ rgw_tenants_ca_bundle | default(omit, true) }}"
    region: "{{ rgw_tenants_s3_region }}"
    access_key: "{{ lookup('vars', 'vault_rgw_tenants_' ~ (item.name | replace('-', '_')) ~ '_access_key') }}"
    secret_key: "{{ lookup('vars', 'vault_rgw_tenants_' ~ (item.name | replace('-', '_')) ~ '_secret_key') }}"
    key_holder: "{{ _rgw_tenants_holders[item.name] }}"
  loop: "{{ _rgw_tenants_present }}"
  loop_control:
    label: "{{ item.name }}: {{ item.buckets | default([]) | join(', ') }}"
  delegate_to: "{{ rgw_tenants_api_host }}"
  become: false
  when:
    - item.buckets | default([]) | length > 0
    - item.name not in _rgw_tenants_rotation_pending | default([])
    - inventory_hostname == rgw_tenants_bootstrap_host
