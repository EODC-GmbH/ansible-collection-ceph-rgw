---
# Register each provider through the IAM API as that tenant's account-root: `radosgw-admin oidc-provider`
# does not work on squid, and a provider is an IAM resource scoped to whoever calls.
- name: Register the OIDC realm as a provider per tenant
  ansible.builtin.command: "python3 /var/run/ceph/{{ _rgw_tenants_fsid }}/manage_oidc_provider.py"
  environment:
    IAM_ENDPOINT: "{{ rgw_tenants_endpoint }}"
    AWS_REGION: "{{ rgw_tenants_s3_region }}"
    OIDC_PROVIDER_URL: "{{ rgw_tenants_oidc.provider_url }}"
    OIDC_CLIENT_IDS: "{{ rgw_tenants_oidc.client_ids | join(',') }}"
    OIDC_THUMBPRINTS: "{{ rgw_tenants_oidc.thumbprints | join(',') }}"
    AWS_ACCESS_KEY_ID: "{{ lookup('vars', 'vault_rgw_tenants_' ~ item.name ~ '_access_key') }}"
    AWS_SECRET_ACCESS_KEY: "{{ lookup('vars', 'vault_rgw_tenants_' ~ item.name ~ '_secret_key') }}"
  loop: "{{ _rgw_tenants_present }}"
  loop_control:
    label: "{{ item.name }} ({{ item.account_id }})"
  register: rgw_tenants_oidc_reg
  changed_when: "'CREATED' in rgw_tenants_oidc_reg.stdout or 'REPLACED' in rgw_tenants_oidc_reg.stdout"
  no_log: true
  notify: Restart RGW for OIDC

- name: Compute the OIDC provider host (provider_url minus scheme)
  ansible.builtin.set_fact:
    _rgw_tenants_provider_host: "{{ rgw_tenants_oidc.provider_url | regex_replace('^https?://', '') }}"

- name: Build the tenant x tier role matrix
  ansible.builtin.set_fact:
    _rgw_tenants_role_matrix: >-
      {{ _rgw_tenants_role_matrix | default([])
         + [{'tenant': item.0, 'tier': item.1, 'name': item.0.name ~ '-' ~ item.1.name}] }}
  loop: "{{ _rgw_tenants_present | product(rgw_tenants_tiers) | list }}"
  loop_control:
    label: "{{ item.0.name }}-{{ item.1.name }}"

# The helper creates the role if absent, calls UpdateAssumeRolePolicy on trust drift, and always re-puts
# the permission policy. Both documents go through the environment: no JSON on disk, none in argv.
- name: Provision each tenant-tier IAM role (create + trust-update + permission policy)
  ansible.builtin.command: "python3 /var/run/ceph/{{ _rgw_tenants_fsid }}/manage_role.py"
  environment:
    IAM_ENDPOINT: "{{ rgw_tenants_endpoint }}"
    AWS_REGION: "{{ rgw_tenants_s3_region }}"
    ROLE_NAME: "{{ item.name }}"
    TRUST_DOC: "{{ lookup('template', 'tenant-trust.json.j2') }}"
    PERM_DOC: "{{ lookup('template', 'tenant-perm.json.j2') }}"
    POLICY_NAME: tenant
    AWS_ACCESS_KEY_ID: "{{ lookup('vars', 'vault_rgw_tenants_' ~ item.tenant.name ~ '_access_key') }}"
    AWS_SECRET_ACCESS_KEY: "{{ lookup('vars', 'vault_rgw_tenants_' ~ item.tenant.name ~ '_secret_key') }}"
  loop: "{{ _rgw_tenants_role_matrix }}"
  loop_control:
    label: "{{ item.name }}"
  register: rgw_tenants_role_reg
  changed_when: "'CREATED' in rgw_tenants_role_reg.stdout or 'UPDATED-TRUST' in rgw_tenants_role_reg.stdout"
  no_log: true

# The loop above only adds, so a removed or renamed tier leaves its "$name-$tier" role behind. Gated,
# because it deletes IAM roles; only ever under the tenant's own name prefix.
- name: Prune orphaned tenant-tier IAM roles (gated)
  ansible.builtin.command:
    argv:
      - cephadm
      - shell
      - --
      - bash
      - -c
      - |
        acct=$1; prefix=$2; keep=$3
        changed=no
        for r in $(radosgw-admin role list --account-id="$acct" | python3 -c 'import sys,json; d=json.load(sys.stdin); rs=d if isinstance(d,list) else d.get("Roles",[]); [print(x.get("RoleName") or x.get("role_name") or x.get("name","")) for x in rs]'); do
          case "$r" in "$prefix"*) : ;; *) continue ;; esac
          case ",$keep," in *",$r,"*) continue ;; esac
          radosgw-admin role-policy delete --role-name="$r" --account-id="$acct" --policy-name=tenant >/dev/null 2>&1 || true
          radosgw-admin role delete --role-name="$r" --account-id="$acct" >/dev/null && changed=yes
        done
        [ "$changed" = yes ] && echo CHANGED || echo OK
      - _
      - "{{ item.account_id }}"
      - "{{ item.name }}-"
      - "{{ rgw_tenants_tiers | map(attribute='name') | map('regex_replace', '^', item.name ~ '-') | join(',') }}"
  loop: "{{ _rgw_tenants_present }}"
  loop_control:
    label: "{{ item.name }} (keep {{ rgw_tenants_tiers | map(attribute='name') | join('/') }})"
  register: rgw_tenants_prune_reg
  changed_when: "'CHANGED' in rgw_tenants_prune_reg.stdout"
  become: true
  when: rgw_tenants_prune_roles | bool
