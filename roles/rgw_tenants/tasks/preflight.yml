---
# Refuse up front on a Ceph this collection was not built against. Without this the first
# `radosgw-admin account get` on a pre-squid cluster exits non-zero for "unrecognized arg",
# every probe in here reads that as "the account does not exist", and the run cheerfully
# reports it is creating an estate that it cannot create. One assert beats debugging that.
#
# Gate on the RGW daemons, not on the CLI the bootstrap host happens to ship: a staggered
# cephadm upgrade leaves the two on different versions on purpose, and every assumption in
# this role is about what the RGWs do.
#
# Included from main.yml and from verify.yml. Both entry points need it: verify.yml is
# entered with tasks_from=verify, which never runs main.yml, and it goes straight to
# `role list --account-id` -- squid-only surface, ungated, on the path an operator reaches
# for precisely when they are unsure what the cluster is.
#
# Near-identical to rgw_sts/tasks/preflight.yml. Two copies because each role has to stand
# alone and Ansible has no way to share a task file between roles without dragging in a
# third role. The module migration in docs/CEPH-VERSIONS.md collapses both into one gate.
- name: Read the daemon versions from the cluster
  # --connect-timeout, and a task timeout over it: without a mon quorum the ceph CLI blocks
  # forever, and an hourly converge that hangs on its first task is worse than one that fails.
  ansible.builtin.command: cephadm shell -- ceph --connect-timeout 10 versions
  register: rgw_tenants_ceph_versions_reg
  changed_when: false
  check_mode: false
  timeout: 120
  become: true

- name: Summarise the RGW daemon versions
  ansible.builtin.set_fact:
    _rgw_tenants_rgw_ceph: "{{ rgw_tenants_ceph_versions_reg.stdout | underknowledge.ceph_rgw.ceph_daemon_versions('rgw') }}"

- name: Assert RGW is deployed
  ansible.builtin.assert:
    quiet: true
    that: _rgw_tenants_rgw_ceph.found
    fail_msg: >-
      The cluster reports no rgw daemons, so there is nothing to provision against. Either
      the RGW service was never deployed (ceph orch apply rgw) or every daemon is down --
      `ceph versions` does not distinguish those, so check `ceph orch ps --daemon-type rgw`.
      Disabling this check does not help: the run would reach the endpoint wait and spend
      2.5 minutes failing there instead.

# An unrecognised version string is not the same as a version out of range, and it must not
# be treated as one: a build whose version cannot be parsed contributes no major number, and
# an empty set of majors satisfies every bound below. Fail on it rather than wave it through.
- name: Assert every RGW version string is one we can read
  ansible.builtin.assert:
    quiet: true
    that: _rgw_tenants_rgw_ceph.unparsed | length == 0
    fail_msg: >-
      Cannot read a Ceph version out of {{ _rgw_tenants_rgw_ceph.unparsed }}. Version
      checking is off the table on this build: set rgw_tenants_ceph_version_check=false to
      proceed unchecked, and expect to verify the accounts and IAM behaviour yourself.

- name: Assert the RGW daemons are a supported Ceph release
  ansible.builtin.assert:
    quiet: true
    that: _rgw_tenants_rgw_ceph.min_major | int >= rgw_tenants_ceph_major_min | int
    fail_msg: >-
      RGW is running Ceph {{ _rgw_tenants_rgw_ceph.versions | join(', ') }}; this role needs
      {{ rgw_tenants_ceph_major_min }}.x (squid) or later. RGW accounts, account-root users,
      `bucket list --account-id` and `account stats` are all squid additions, and every
      tenant here is an account. Upgrade RGW, or pin this collection to a release that
      predates accounts.

# Not fatal: a newer Ceph is the expected state of affairs eventually, and refusing to run
# on it would make this collection the thing blocking an upgrade. Say so and carry on.
- name: Warn that RGW is newer than anything this role was tested against
  ansible.builtin.debug:
    msg: >-
      RGW is running Ceph {{ _rgw_tenants_rgw_ceph.versions | join(', ') }}, past the
      {{ rgw_tenants_ceph_major_tested }}.x this role was tested against. Nothing here uses
      the tenant-level IAM that Ceph is removing (see docs/CEPH-VERSIONS.md), so it should
      hold, but verify with rgw_tenants_plan=true before trusting a converge.
  when: _rgw_tenants_rgw_ceph.max_major | int > rgw_tenants_ceph_major_tested | int
