---
# Read-only on the cluster. The only writes are adoption stubs on the control host.
- name: Collect the managed account ids
  ansible.builtin.set_fact:
    _rgw_discover_managed_ids: "{{ rgw_tenants_list | map(attribute='account_id') | list }}"

# buckets: true costs one `bucket stats` per bucket in the cluster; it lets a stub list
# the buckets the account already owns.
- name: List all RGW accounts
  underknowledge.ceph_rgw.rgw_account_info:
    all: true
    buckets: true
    fsid: "{{ rgw_tenants_fsid | default(omit, true) }}"
  register: _rgw_discover
  become: true

- name: Report managed vs unmanaged
  ansible.builtin.debug:
    msg: >-
      {{ item.id }} name={{ item.name | default('-', true) }}
      [{{ 'MANAGED' if item.id in _rgw_discover_managed_ids else 'UNMANAGED' }}]
      users={{ item.users | length }} roles={{ item.roles | length }}
      buckets={{ item.buckets | join(',') if item.buckets else '-' }}
  loop: "{{ _rgw_discover.accounts }}"
  loop_control:
    label: "{{ item.id }}"

- name: Create the discovery output directory
  ansible.builtin.file:
    path: "{{ rgw_tenants_discover_output_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false

- name: Write an adoption stub for each unmanaged account
  ansible.builtin.template:
    src: adopt-tenant.yml.j2
    dest: "{{ rgw_tenants_discover_output_dir }}/adopt-{{ item.id }}.yml"
    mode: "0644"
  vars:
    _rgw_tenants_acct: "{{ item }}"
  loop: "{{ _rgw_discover.accounts | rejectattr('id', 'in', _rgw_discover_managed_ids) | list }}"
  loop_control:
    label: "{{ item.id }}"
  delegate_to: localhost
  become: false

- name: Report the discovery summary
  ansible.builtin.debug:
    msg: >-
      {{ _rgw_discover.accounts | length }} accounts:
      {{ _rgw_discover.accounts | selectattr('id', 'in', _rgw_discover_managed_ids) | list | length }} managed,
      {{ _rgw_discover.accounts | rejectattr('id', 'in', _rgw_discover_managed_ids) | list | length }} unmanaged
      (adoption stubs in {{ rgw_tenants_discover_output_dir }}/). No cluster changes made.
