---
# Read-only check of each tenant's account, buckets and quota. Run with tasks_from=verify.
# IAM roles are checked by rgw_iam under --check.
- name: Load the tenant drop-ins
  ansible.builtin.include_tasks: load_tenants.yml

# One pass for the whole cluster: resolving bucket ownership costs a `bucket stats` per
# bucket, so a per-tenant pass would rescan every bucket once per tenant.
- name: List all RGW accounts with their buckets
  underknowledge.ceph_rgw.rgw_account_info:
    all: true
    buckets: true
    fsid: "{{ rgw_tenants_fsid | default(omit, true) }}"
  register: _rgw_verify
  become: true
  when:
    - rgw_tenants_list | length > 0
    - inventory_hostname == rgw_tenants_bootstrap_host

- name: Report each tenant, desired vs live
  ansible.builtin.debug:
    msg: >-
      {{ item.name }} ({{ item.account_id }}):
      {{ 'ACCOUNT MISSING' if _live is none else '' }}
      buckets desired={{ item.buckets | default([]) | sort }}
      live={{ _live.buckets | default([]) | sort }}
      {{ 'MISSING=' ~ _missing if _missing else '' }};
      quota desired={{ item.quota | default({}, true) or 'unset' }}
      live={{ _live.quota | default({}) }}
  vars:
    _live: "{{ (_rgw_verify.accounts | selectattr('id', 'equalto', item.account_id) | list | first) | default(none, true) }}"
    _missing: "{{ item.buckets | default([]) | reject('in', _live.buckets | default([])) | list }}"
  loop: "{{ rgw_tenants_list }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - rgw_tenants_list | length > 0
    - inventory_hostname == rgw_tenants_bootstrap_host

- name: Report verification summary
  ansible.builtin.debug:
    msg: >-
      {{ rgw_tenants_list | length }} tenant(s) compared against the cluster. Check IAM
      roles with rgw_iam under --check, and the federation path with
      files/verify_federation.py.
  when: inventory_hostname == rgw_tenants_bootstrap_host
