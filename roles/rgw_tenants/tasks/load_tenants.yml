---
# Included by both main.yml and verify.yml, since tasks_from=verify bypasses main.yml.
- name: Load tenant drop-ins from rgw_tenants_dir
  ansible.builtin.include_vars:
    dir: "{{ rgw_tenants_dir }}"
    extensions:
      - yml
      - yaml
    # Otherwise a README or *.yml.sample in the directory aborts the run.
    ignore_unknown_extensions: true
  when: rgw_tenants_dir | length > 0

# Tenant `big-corp` lives in rgw_tenant_big_corp with keys
# vault_rgw_tenants_big_corp_*: the name keeps its hyphen, the variable cannot. A variable
# spelled otherwise would match no pattern below and the tenant would be skipped silently.
- name: Refuse a drop-in whose variable name is not a valid identifier
  ansible.builtin.assert:
    quiet: true
    that: _rgw_tenants_bad_names | length == 0
    fail_msg: >-
      These drop-in variables would be silently ignored: {{ _rgw_tenants_bad_names }}.
      A tenant's `name` is hyphenated but its variable name must be underscored, because
      an Ansible variable name is an identifier. Tenant 'big-corp' goes in
      rgw_tenant_big_corp with vault_rgw_tenants_big_corp_access_key, and keeps
      `name: big-corp` inside the block.
  vars:
    _rgw_tenants_bad_names: >-
      {{ query('ansible.builtin.varnames', '^rgw_tenant_')
         | reject('match', '^rgw_tenant_[a-z0-9_]+$') | list }}
  when: rgw_tenants_dir | length > 0

# lookup('vars') rather than map('extract', vars): extract returns values untemplated, so
# max_size: "{{ 10 * 1024 ** 3 }}" would reach radosgw-admin as that literal string. The
# singular rgw_tenant_ prefix keeps the pattern off this role's rgw_tenants_* variables.
- name: Collect the drop-in tenants
  ansible.builtin.set_fact:
    _rgw_tenants_dropins: "{{ (_rgw_tenants_dropins | default([])) + [lookup('vars', item)] }}"
  loop: "{{ query('ansible.builtin.varnames', '^rgw_tenant_[a-z0-9_]+$') | sort }}"
  loop_control:
    label: "{{ item }}"
  when: rgw_tenants_dir | length > 0

# Deduplicated by name, last wins: set_fact persists for the run, so a second invocation
# of the role in one play would otherwise list every drop-in twice.
- name: Assemble rgw_tenants_list
  ansible.builtin.set_fact:
    rgw_tenants_list: "{{ dict(_rgw_seen | map(attribute='name') | zip(_rgw_seen)).values() | list }}"
  vars:
    _rgw_seen: "{{ (rgw_tenants_list | default([], true)) + (_rgw_tenants_dropins | default([])) }}"

# The role's own argument validation runs before the drop-ins are loaded, so it never
# sees them. Validate the assembled list again.
- name: Validate the assembled tenant list against the role's argument spec
  ansible.builtin.validate_argument_spec:
    argument_spec: "{{ (lookup('ansible.builtin.file', role_path ~ '/meta/argument_specs.yml') | from_yaml).argument_specs.main.options }}"
    provided_arguments:
      rgw_tenants_list: "{{ rgw_tenants_list | default([], true) }}"
  when: rgw_tenants_list | default([], true) | length > 0
