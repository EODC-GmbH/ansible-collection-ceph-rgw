---
# Without this restart, web-identity AssumeRole keeps failing with "Signature can not be validated with
# the JWKS present": RGW caches the provider (thumbprint + client ids) in memory, and an IAM-API create
# or replace does not refresh the running daemon.
- name: Restart RGW for OIDC
  ansible.builtin.command: "cephadm shell -- ceph orch restart {{ rgw_tenants_service_name }}"
  changed_when: true
  become: true
  when: inventory_hostname == rgw_tenants_bootstrap_host
