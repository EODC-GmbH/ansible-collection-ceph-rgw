---
# rgw_sts: native RGW STS without Keystone. OIDC providers are registered by rgw_tenants
# and the web-identity tenant roles by rgw_iam.

# Host owning the cephadm bootstrap keyring; all radosgw-admin/ceph work runs there.
rgw_sts_bootstrap_host: "{{ groups['mons'][0] }}"

# Cluster fsid. Empty => read from /etc/ceph/ceph.conf.
rgw_sts_fsid: ""

# cephadm RGW service restarted when the STS runtime config changes. Check
# `ceph orch ls --service-type rgw` if it is not literally rgw.rgw.
rgw_sts_service_name: "rgw.rgw"

# STS session-token signing key, from vault. Required: the role refuses to enable STS
# without it. 16+ random characters.
rgw_sts_key: ""

# Standalone IAM roles for AssumeRole / GetSessionToken. Each item:
#   {name, account_id, trust_policy: <doc>, policies: [{name, document: <doc>}]}
# account_id is required: rgw_role addresses a role only within an account.
rgw_sts_roles: []
