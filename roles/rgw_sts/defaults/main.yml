---
# Native RGW STS, no Keystone: the session-token signing key, STS auth on the S3 endpoint, and the IAM
# roles AssumeRole resolves against. OIDC web-identity federation is rgw_tenants' job — squid takes
# provider registration through the IAM API only, radosgw-admin cannot do it. Override these in
# environments/$env/cephadm.yml; the signing key belongs in your vault.

# Supported Ceph range, checked against the RGW daemons before anything else runs. Squid is
# the floor: rgw_sts_roles creates account-scoped roles, and accounts are a squid feature.
# _tested is the newest release this was exercised on: past it you get a warning, not a
# refusal, because blocking a Ceph upgrade is worse than running unverified. Reasoning and
# the removal timeline are in docs/CEPH-VERSIONS.md.
rgw_sts_ceph_major_min: 19
rgw_sts_ceph_major_tested: 20

# Turn off ALL THREE preflight checks -- the version floor, the RGW-is-deployed check and
# the unreadable-version-string check -- for a build whose version cannot be read (a vendor
# rebuild). It is named for the least important of the three. You then own verifying that
# accounts and IAM behave the way this role expects. Note `-e rgw_sts_ceph_version_check=`
# with an empty value is false, so a typo'd override disables the lot.
rgw_sts_ceph_version_check: true

# Host that owns the cephadm bootstrap keyring. All radosgw-admin/ceph work runs there.
rgw_sts_bootstrap_host: "{{ groups['mons'][0] }}"

# Cluster fsid. Empty => discovered via `cephadm shell -- ceph fsid`.
rgw_sts_fsid: ""

# Restarted when the STS runtime config changes. Check `ceph orch ls --service-type rgw` and override
# if yours is not literally "rgw.rgw".
rgw_sts_service_name: "rgw.rgw"

# Session-token signing key, 16+ random chars, from your vault. Leave it empty and the role refuses to
# enable STS auth rather than fall back to Ceph's built-in default key "sts".
rgw_sts_key: ""

# Standalone IAM roles for AssumeRole; rgw_tenants provisions the web-identity ones. Each item:
# { name, account_id, trust_policy: $doc, policies: [{name, document}] }.
#
# account_id is required, and the role asserts it rather than falling back. Without it
# radosgw-admin would create a tenant-level role -- the admin-only CreateRole/PutRolePolicy path
# tentacle deprecated, slated for removal no sooner than the V release, as is sts:GetSessionToken.
# Only an account-scoped role survives that, so the unscoped form is refused, not offered.
# AssumeRoleWithWebIdentity, which is what the tenants layer runs on, is not on the removal list.
# Normally empty: rgw_tenants covers federated access on its own.
rgw_sts_roles: []
