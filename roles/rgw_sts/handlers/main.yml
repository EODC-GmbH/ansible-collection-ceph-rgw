---
# rgw_sts_key and rgw_s3_auth_use_sts are read at startup. The module waits until the daemons
# run again.
- name: Restart RGW
  underknowledge.ceph_rgw.rgw_orch_restart:
    service: "{{ rgw_sts_service_name }}"
    fsid: "{{ rgw_sts_fsid | default(omit, true) }}"
  become: true
  when: inventory_hostname == rgw_sts_bootstrap_host
