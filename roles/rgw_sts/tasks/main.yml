---
# secret_value is no_log in the module's argument spec and redacted from Ceph's output,
# so a failure still shows Ceph's message. `ceph config set` takes the value only on argv,
# so it is briefly visible in `ps` on the mon; mount /proc with hidepid=2 there.
- name: Set the STS signing key
  underknowledge.ceph_rgw.rgw_config:
    option: rgw_sts_key
    secret_value: "{{ rgw_sts_key }}"
    fsid: "{{ rgw_sts_fsid | default(omit, true) }}"
  notify: Restart RGW
  become: true
  when:
    - rgw_sts_key | length > 0
    - inventory_hostname == rgw_sts_bootstrap_host

# Without a key, RGW signs session tokens with its public default "sts".
- name: Assert an STS signing key is set
  ansible.builtin.assert:
    quiet: true
    that: rgw_sts_key | length > 0
    fail_msg: >-
      Refusing to enable rgw_s3_auth_use_sts while rgw_sts_key is unset: RGW would sign STS
      session tokens with Ceph's well-known default key "sts", making them forgeable. Set
      rgw_sts_key from vault_rgw_sts_key (16+ random chars) and re-run.
  when: inventory_hostname == rgw_sts_bootstrap_host

- name: Enable STS auth
  underknowledge.ceph_rgw.rgw_config:
    option: rgw_s3_auth_use_sts
    value: "true"
    fsid: "{{ rgw_sts_fsid | default(omit, true) }}"
  notify: Restart RGW
  become: true
  when: inventory_hostname == rgw_sts_bootstrap_host

# rgw_role addresses a role only within an account, so fail here with the reason rather
# than mid-loop.
- name: Assert every STS role names an account
  ansible.builtin.assert:
    quiet: true
    that: rgw_sts_roles | map(attribute='account_id', default='') | select('equalto', '') | list | length == 0
    fail_msg: >-
      rgw_sts_roles entries {{ _rgw_sts_unscoped }} have no account_id. Every role must be
      scoped to an RGW account: give each one the account_id its ARN carries
      (arn:aws:iam::<account_id>:role/<name>).
  vars:
    _rgw_sts_unscoped: >-
      {{ rgw_sts_roles | rejectattr('account_id', 'defined') | map(attribute='name') | list
         + rgw_sts_roles | selectattr('account_id', 'defined')
                         | selectattr('account_id', 'equalto', '')
                         | map(attribute='name') | list }}
  when: inventory_hostname == rgw_sts_bootstrap_host

# policies is authoritative: purge_policies defaults true, so a policy dropped from config
# is deleted from the role.
- name: Reconcile the STS roles
  underknowledge.ceph_rgw.rgw_role:
    name: "{{ item.name }}"
    account_id: "{{ item.account_id }}"
    assume_role_policy_document: "{{ item.trust_policy }}"
    policies: "{{ item.policies }}"
    fsid: "{{ rgw_sts_fsid | default(omit, true) }}"
  loop: "{{ rgw_sts_roles }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  when: inventory_hostname == rgw_sts_bootstrap_host
