---
# Same gate as rgw_tenants, and for the same reason: fail on an unsupported Ceph here rather
# than three roles later with an error about something else. Kept in this role too because
# rgw_sts is the one that runs first, and because it can be imported on its own.
#
# Gate on the RGW daemons, not on the CLI the bootstrap host ships: a staggered cephadm
# upgrade leaves the two on different versions on purpose, and what matters is what the RGWs
# do with rgw_s3_auth_use_sts and with an account-scoped role.
#
# Near-identical to rgw_tenants/tasks/preflight.yml. Two copies because each role has to
# stand alone and Ansible has no way to share a task file between roles without dragging in
# a third role. The module migration in docs/CEPH-VERSIONS.md collapses both into one gate.
- name: Read the daemon versions from the cluster
  # --connect-timeout, and a task timeout over it: without a mon quorum the ceph CLI blocks
  # forever, and an hourly converge that hangs on its first task is worse than one that fails.
  ansible.builtin.command: cephadm shell -- ceph --connect-timeout 10 versions
  register: rgw_sts_ceph_versions_reg
  changed_when: false
  check_mode: false
  timeout: 120
  become: true

- name: Summarise the RGW daemon versions
  ansible.builtin.set_fact:
    _rgw_sts_rgw_ceph: "{{ rgw_sts_ceph_versions_reg.stdout | underknowledge.ceph_rgw.ceph_daemon_versions('rgw') }}"

- name: Assert RGW is deployed
  ansible.builtin.assert:
    quiet: true
    that: _rgw_sts_rgw_ceph.found
    fail_msg: >-
      The cluster reports no rgw daemons. Enabling STS auth on an endpoint that does not
      exist yet gets you a restart handler firing against nothing. Either the RGW service
      was never deployed (ceph orch apply rgw) or every daemon is down -- `ceph versions`
      does not distinguish those, so check `ceph orch ps --daemon-type rgw`.

# An unparseable version contributes no major number, and an empty set of majors satisfies
# every bound below. Fail on it instead of gating on nothing.
- name: Assert every RGW version string is one we can read
  ansible.builtin.assert:
    quiet: true
    that: _rgw_sts_rgw_ceph.unparsed | length == 0
    fail_msg: >-
      Cannot read a Ceph version out of {{ _rgw_sts_rgw_ceph.unparsed }}. Set
      rgw_sts_ceph_version_check=false to proceed unchecked, and verify the STS behaviour
      yourself.

- name: Assert the RGW daemons are a supported Ceph release
  ansible.builtin.assert:
    quiet: true
    that: _rgw_sts_rgw_ceph.min_major | int >= rgw_sts_ceph_major_min | int
    fail_msg: >-
      RGW is running Ceph {{ _rgw_sts_rgw_ceph.versions | join(', ') }}; this role needs
      {{ rgw_sts_ceph_major_min }}.x (squid) or later. Account-scoped IAM roles, which is
      the only kind rgw_sts_roles will create, arrived with squid's accounts.

# Not fatal: a newer Ceph is the expected state of affairs eventually, and refusing to run
# on it would make this collection the thing blocking an upgrade. Say so and carry on.
- name: Warn that RGW is newer than anything this role was tested against
  ansible.builtin.debug:
    msg: >-
      RGW is running Ceph {{ _rgw_sts_rgw_ceph.versions | join(', ') }}, past the
      {{ rgw_sts_ceph_major_tested }}.x this role was tested against. The tenant-level IAM
      Ceph is removing is not used here (see docs/CEPH-VERSIONS.md), but re-check that
      rgw_s3_auth_use_sts still reads back on after the run.
  when: _rgw_sts_rgw_ceph.max_major | int > rgw_sts_ceph_major_tested | int
