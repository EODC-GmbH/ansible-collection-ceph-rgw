---
# Generate one tenant drop-in for the rgw_tenants role: the rgw_tenant_<name> config block
# plus the account-root keys as inline !vault blocks. rgw_tenants never generates keys, so
# they have to exist before it runs. Touches no cluster.
#
#   ansible-playbook playbooks/rgw_new_tenant.yml                    # prompts
#   ANSIBLE_VAULT_PASSWORD_FILE=~/.vault-pass \
#   ansible-playbook playbooks/rgw_new_tenant.yml -e rgw_new_tenant=initrode-data-prod \
#     -e '{"rgw_new_tenant_root_users": ["Erika Schröder", "backup"]}' \
#     -e '{"rgw_new_tenant_quota": {"enabled": true, "max_size": 1099511627776, "max_objects": -1}}'
#
# Inputs (rgw_new_tenant is prompted when not passed; the rest are -e only, all optional):
#   rgw_new_tenant                     account name, lowercase [a-z0-9-]
#   rgw_new_tenant_account_id          explicit "RGW"+17 digits; omit to allocate one
#   rgw_new_tenant_root_users          raw names/labels for extra roots, each sanitized
#   rgw_new_tenant_buckets             default []
#   rgw_new_tenant_quota               omit to fall back to rgw_tenants_default_quota
#   rgw_new_tenant_output_dir          default ./rgw_tenants.d
#   rgw_new_tenant_vault_password_file default $ANSIBLE_VAULT_PASSWORD_FILE
#   rgw_new_tenant_force               regenerate an existing drop-in: keeps its account_id,
#                                      mints new keys
- name: Generate a tenant drop-in (account + root users + vaulted keys)
  hosts: localhost
  connection: local
  gather_facts: false
  vars_prompt:
    - name: rgw_new_tenant
      prompt: "RGW tenant account name (e.g. initrode-data-prod)"
      private: false
  vars:
    # Aliased rather than declared under their own names: a play var would shadow an
    # inventory override.
    _nt_output_dir: "{{ rgw_new_tenant_output_dir | default(playbook_dir ~ '/rgw_tenants.d', true) }}"
    _nt_vault_password_file: "{{ rgw_new_tenant_vault_password_file | default(lookup('ansible.builtin.env', 'ANSIBLE_VAULT_PASSWORD_FILE'), true) }}"
    rgw_new_tenant_force: false
    rgw_new_tenant_buckets: []
    rgw_new_tenant_root_users: []
    # This tenant's own inline entry is not a conflict: its drop-in overrides it by name.
    _nt_existing_ids: "{{ rgw_tenants_list | default([], true) | rejectattr('name', 'equalto', _nt_name) | map(attribute='account_id') | list }}"
    _nt_old_id: "{{ _nt_old['rgw_tenant_' ~ _nt_var_name].account_id if _nt_old is defined else '' }}"
    # ceph_account_slug, not ceph_descriptor: the latter folds hyphens to underscores, and
    # RGW rejects an underscore in the <account>-<role> role name. Guarded so '' reaches
    # the assert instead of a filter error.
    _nt_name: "{{ (rgw_new_tenant | underknowledge.ceph_rgw.ceph_account_slug) if (rgw_new_tenant | default('') | length > 0) else '' }}"
    # _nt_account_id is set with set_fact below: as a play var its `date` lookup would
    # re-run on every reference.
    _nt_root_user: "{{ _nt_name | underknowledge.ceph_rgw.ceph_root_uid }}"
    # Variable names cannot carry the tenant name's hyphens.
    _nt_var_name: "{{ _nt_name | replace('-', '_') }}"
    _nt_root_slugs: "{{ rgw_new_tenant_root_users | map('underknowledge.ceph_rgw.ceph_descriptor') | unique | list }}"
    _nt_dropin_file: "{{ _nt_output_dir }}/{{ _nt_name }}.yml"
    _nt_key_stems: >-
      {{ ['vault_rgw_tenants_' ~ _nt_var_name]
         + (_nt_root_slugs | map('regex_replace', '^', 'vault_rgw_tenants_' ~ _nt_var_name ~ '_root_') | list) }}
  tasks:
    - name: Assert an account name was provided
      ansible.builtin.assert:
        quiet: true
        that:
          - rgw_new_tenant is defined
          - rgw_new_tenant | length > 0
        fail_msg: >-
          No account name. Pass -e rgw_new_tenant=<name> or answer the prompt.

    - name: Warn when the account name was canonicalized
      ansible.builtin.debug:
        msg: >-
          You entered '{{ rgw_new_tenant }}'; using the canonical account name '{{ _nt_name }}'.
          The account name is permanent (it drives the uid, vault keys, bucket prefix
          and ARNs). Re-run with the exact name you want if this is not it.
      when: _nt_name != rgw_new_tenant

    - name: Assert the account name is valid
      ansible.builtin.assert:
        quiet: true
        that: _nt_name | underknowledge.ceph_rgw.ceph_account_valid
        fail_msg: >-
          '{{ rgw_new_tenant }}' is not a valid account name:
          it must sanitize to lowercase [a-z0-9-], at most 55 characters, e.g.
          initrode-data-prod. No underscore: RGW rejects one in the <tenant>-<role> IAM
          role name.
          Got '{{ _nt_name }}'.

    - name: Check for an existing drop-in
      ansible.builtin.stat:
        path: "{{ _nt_dropin_file }}"
      register: _nt_existing_file

    - name: Assert the drop-in does not exist yet
      ansible.builtin.assert:
        quiet: true
        that: not _nt_existing_file.stat.exists
        fail_msg: >-
          {{ _nt_dropin_file }} already exists.
          To add a root user run the rgw_add_root_user playbook;
          to remove one, set its root_users entry state: absent and re-run the role (then delete the entry);
          to regenerate it (same account_id, new keys; apply them with
          rgw_tenants_rotate_keys=true) pass -e rgw_new_tenant_force=true.
      when: not (rgw_new_tenant_force | bool)

    # Inline !vault values are not decrypted here, so this works with a lost vault password.
    - name: Load the drop-in being replaced
      ansible.builtin.include_vars:
        file: "{{ _nt_dropin_file }}"
        name: _nt_old
      when: _nt_existing_file.stat.exists

    - name: Assert the drop-in being replaced is this tenant's
      ansible.builtin.assert:
        quiet: true
        that:
          - ('rgw_tenant_' ~ _nt_var_name) in _nt_old
          - _nt_old['rgw_tenant_' ~ _nt_var_name].account_id | default('') is match('^RGW[0-9]{17}\Z')
        fail_msg: >-
          {{ _nt_dropin_file }} has no rgw_tenant_{{ _nt_var_name }}.account_id; refusing to
          overwrite it. Move it aside if the tenant was never applied.
      when: _nt_existing_file.stat.exists

    # A replaced drop-in keeps its account_id. Otherwise `date +%s%N` truncated to 17
    # digits: seconds plus 7 fractional digits.
    - name: Set the account id
      ansible.builtin.set_fact:
        _nt_account_id: >-
          {{ rgw_new_tenant_account_id | default(_nt_old_id, true)
             | default('RGW' ~ lookup('ansible.builtin.pipe', 'date +%s%N')[:17], true) }}

    - name: Assert force keeps the tenant's account_id
      ansible.builtin.assert:
        quiet: true
        that: _nt_old_id | length == 0 or _nt_account_id == _nt_old_id
        fail_msg: >-
          {{ _nt_name }} is account {{ _nt_old_id }}; force regenerates keys, not the account.
          Drop -e rgw_new_tenant_account_id, or retire the tenant (state: absent) first.
          If it was never applied, delete {{ _nt_dropin_file }} and re-run.

    - name: Assert a vault password file is available
      ansible.builtin.assert:
        quiet: true
        that: _nt_vault_password_file | length > 0
        fail_msg: >-
          No vault password file. Export ANSIBLE_VAULT_PASSWORD_FILE or pass
          -e rgw_new_tenant_vault_password_file=<path>; it encrypts the generated keys.

    - name: Gather account_ids already present in the drop-in directory
      ansible.builtin.set_fact:
        _nt_dir_ids: "{{ (_nt_dir_ids | default([])) + (lookup('ansible.builtin.file', item) | regex_findall('RGW[0-9]{17}')) }}"
      loop: >-
        {{ query('ansible.builtin.fileglob', _nt_output_dir ~ '/*.yml')
           + query('ansible.builtin.fileglob', _nt_output_dir ~ '/*.yaml') }}
      loop_control:
        label: "{{ item | basename }}"
      when: (item | basename) != (_nt_name ~ '.yml')

    - name: Assert the account_id is well-formed and unused
      ansible.builtin.assert:
        quiet: true
        that:
          - _nt_account_id is match('^RGW[0-9]{17}\Z')
          - _nt_account_id not in (_nt_existing_ids + (_nt_dir_ids | default([])))
        fail_msg: >-
          account_id {{ _nt_account_id }} already exists
          (in rgw_tenants_list or {{ _nt_output_dir }}), or is malformed.
          Re-run, or pass -e rgw_new_tenant_account_id=.

    - name: Ensure the output directory exists
      ansible.builtin.file:
        path: "{{ _nt_output_dir }}"
        state: directory
        mode: "0700"

    - name: Build the root_users config list
      ansible.builtin.set_fact:
        _nt_root_users_cfg: "{{ (_nt_root_users_cfg | default([])) + [{'name': item}] }}"
      loop: "{{ _nt_root_slugs }}"

    # The password lookup with /dev/null generates without storing. Plaintext goes on
    # stdin, not argv. --encrypt-vault-id default picks our password file when the outer
    # run also exports ANSIBLE_VAULT_PASSWORD_FILE. check_mode: false because these write
    # nothing and the copy below needs their output.
    - name: Encrypt the access and secret key of each root
      ansible.builtin.command:
        argv: [ansible-vault, encrypt_string, --vault-password-file, "{{ _nt_vault_password_file }}",
               --encrypt-vault-id, default, --stdin-name, "{{ item.0 }}_{{ item.1 }}"]
        stdin: >-
          {{ ('IAM' ~ lookup('ansible.builtin.password', '/dev/null length=17 chars=ascii_uppercase,digits'))
             if item.1 == 'access_key'
             else lookup('ansible.builtin.password', '/dev/null length=40 chars=ascii_letters,digits') }}
        stdin_add_newline: false
      loop: "{{ _nt_key_stems | product(['access_key', 'secret_key']) | list }}"
      loop_control:
        label: "{{ item.0 }}_{{ item.1 }}"
      register: _nt_enc
      changed_when: false
      check_mode: false
      no_log: true

    - name: Write the tenant drop-in
      ansible.builtin.copy:
        dest: "{{ _nt_dropin_file }}"
        mode: "0600"
        content: |
          ---
          # Tenant drop-in for the rgw_tenants role, generated by rgw_new_tenant.
          # Drop into the directory rgw_tenants_dir points at; delete to remove the tenant.
          # Config + account-root keys live together; keys are inline !vault (safe to commit).
          {{ {'rgw_tenant_' ~ _nt_var_name: _nt_entry} | to_nice_yaml }}
          {% for r in _nt_enc.results %}
          {{ r.stdout }}
          {% endfor %}
      vars:
        _nt_entry: >-
          {{ {'name': _nt_name, 'account_id': _nt_account_id, 'root_user': _nt_root_user}
             | combine({'buckets': rgw_new_tenant_buckets} if (rgw_new_tenant_buckets | length > 0) else {})
             | combine({'quota': rgw_new_tenant_quota} if (rgw_new_tenant_quota is defined) else {})
             | combine({'root_users': _nt_root_users_cfg | default([])} if (_nt_root_slugs | length > 0) else {}) }}

    - name: Warn about keys the regenerated drop-in drops
      ansible.builtin.debug:
        msg: >-
          The regenerated drop-in no longer declares {{ _nt_dropped | join(', ') }};
          re-run with the matching -e rgw_new_tenant_* inputs to keep them.
      vars:
        _nt_dropped: >-
          {{ _nt_old['rgw_tenant_' ~ _nt_var_name].keys()
             | difference(['name', 'account_id', 'root_user']
                          + (['buckets'] if (rgw_new_tenant_buckets | length > 0) else [])
                          + (['quota'] if (rgw_new_tenant_quota is defined) else [])
                          + (['root_users'] if (_nt_root_slugs | length > 0) else [])) }}
      when: _nt_old_id | length > 0 and _nt_dropped | length > 0

    - name: Report what was generated
      ansible.builtin.debug:
        msg:
          - "tenant:      {{ _nt_name }}  ({{ _nt_account_id }})"
          - "primary root: {{ _nt_root_user }}"
          - "extra roots: {{ _nt_root_slugs | map('regex_replace', '^', 'iam-' ~ _nt_name ~ '-root-') | list | default(['(none)'], true) }}"
          - "buckets:     {{ rgw_new_tenant_buckets | default([], true) | join(', ') | default('(none)', true) }}"
          - "quota:       {{ 'set' if (rgw_new_tenant_quota is defined) else 'omitted (falls back to rgw_tenants_default_quota)' }}"
          - "drop-in:     {{ _nt_dropin_file }}"
          - "{{ 'keys replaced: existing RGW users keep their old keys until rgw_tenants runs with -e rgw_tenants_rotate_keys=true' if _nt_old_id | length > 0 else '' }}"
          - "next: point rgw_tenants_dir at {{ _nt_output_dir }}, review, commit, run rgw_tenants."
