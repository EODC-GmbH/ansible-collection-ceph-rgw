---
# Add one account-root user to an existing tenant drop-in: generate keys for
# iam-<tenant>-root-<slug>, vault-encrypt them and merge the root_users entry and its two
# !vault blocks into the file. Existing ciphertext is copied through unchanged. Touches no
# cluster. The work is in tasks/add_user.yml.
#
# To remove a user, set `state: absent` on its entry and run rgw_tenants, then delete the
# entry and its vault blocks. To suspend one, set `suspended: true`.
#
#   ansible-playbook playbooks/rgw_add_root_user.yml                 # prompts
#   ANSIBLE_VAULT_PASSWORD_FILE=~/.vault-pass \
#   ansible-playbook playbooks/rgw_add_root_user.yml \
#     -e rgw_add_root_user_tenant=raviga-data-prod -e '{"rgw_add_root_user": "Erika Schröder"}'
#
# Inputs (both names are prompted when not passed; both required):
#   rgw_add_root_user_tenant           existing tenant account name as written in the drop-in;
#                                      a non-canonical spelling is refused
#   rgw_add_root_user                  person name or service label, sanitized to the
#                                      descriptor slug by ceph_descriptor
#   rgw_add_root_user_output_dir       default <playbook dir>/rgw_tenants.d
#   rgw_add_root_user_vault_password_file  default: Ansible's vault config, else
#                                          $KAYOBE_VAULT_PASSWORD (tasks/vault_id.yml)
- name: Add an account-root user to a tenant drop-in
  hosts: localhost
  connection: local
  gather_facts: false
  # A name with spaces needs no quoting at the prompt, but needs the JSON form with -e.
  # default "": without a terminal an unasked prompt otherwise yields the string 'None'.
  vars_prompt:
    - name: rgw_add_root_user_tenant
      prompt: "Existing RGW tenant account (e.g. raviga-data-prod)"
      private: false
      default: ""
    - name: rgw_add_root_user
      prompt: "New root user, person name or label (e.g. Erika Schröder, or backup)"
      private: false
      default: ""
  vars:
    # Aliased because a play var under the input's own name would shadow an inventory override.
    _au_kind: root
    _au_tenant_var: rgw_add_root_user_tenant
    _au_tenant_in: "{{ rgw_add_root_user_tenant | default('', true) }}"
    _au_user_var: rgw_add_root_user
    _au_user_in: "{{ rgw_add_root_user | default('', true) }}"
    _au_output_dir: "{{ rgw_add_root_user_output_dir | default(playbook_dir ~ '/rgw_tenants.d', true) }}"
    _au_vault_var: rgw_add_root_user_vault_password_file
    _au_vault_file: "{{ rgw_add_root_user_vault_password_file | default('', true) }}"
  tasks:
    - name: Add the root user
      ansible.builtin.import_tasks: tasks/add_user.yml
