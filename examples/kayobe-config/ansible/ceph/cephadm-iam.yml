---
# Reconcile the per-tenant IAM roles with underknowledge.ceph_rgw.rgw_iam. Runs after
# cephadm-tenants.yml, which creates the OIDC providers the trust policies reference.
# --check --diff shows the plan; a run with no changes means IAM matches config.
- name: Reconcile Ceph RGW tenant IAM roles
  gather_facts: false
  hosts: mons
  become: true
  tags:
    - cephadm
    - cephadm-iam
  tasks:
    - name: Apply Cephadm RGW IAM configuration
      ansible.builtin.import_role:
        name: underknowledge.ceph_rgw.rgw_iam
