---
# Read-only check of accounts, buckets and quotas. IAM roles are checked by cephadm-iam.yml
# under --check, federation by roles/rgw_tenants/files/verify_federation.py.
- name: Verify Ceph RGW tenants
  gather_facts: false
  hosts: mons
  become: true
  tags:
    - cephadm-tenants-verify
  tasks:
    - name: Run rgw_tenants read-only verification
      ansible.builtin.import_role:
        name: underknowledge.ceph_rgw.rgw_tenants
        tasks_from: verify
