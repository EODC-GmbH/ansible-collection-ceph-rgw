---
# Read-only check of the tenant provisioning: asserts the per-tier roles and declared buckets, reports
# quota. No IdP, no user password needed. Run it on demand; keep it out of the deploy chain:
#   kayobe playbook run .../ansible/ceph/cephadm-tenants-verify.yml
# For the full login -> assume -> S3 path, run roles/rgw_tenants/files/verify_federation.py per user.
- name: Verify Ceph RGW tenants
  gather_facts: false
  hosts: mons
  become: true
  tags:
    - cephadm-tenants-verify
  tasks:
    - name: Run rgw_tenants read-only verification
      ansible.builtin.import_role:
        name: underknowledge.ceph_rgw.rgw_tenants
        tasks_from: verify
