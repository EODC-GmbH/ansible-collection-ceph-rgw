---
# Configure native RGW STS with underknowledge.ceph_rgw.rgw_sts. Runs after
# cephadm-commands-post.yml so its RGW restart picks up the full config. The signing key
# comes from vault_rgw_sts_key.
- name: Ensure native RGW STS is configured
  gather_facts: false
  hosts: mons
  become: true
  tags:
    - cephadm
    - cephadm-sts
  tasks:
    - name: Apply Cephadm RGW STS configuration
      ansible.builtin.import_role:
        name: underknowledge.ceph_rgw.rgw_sts
