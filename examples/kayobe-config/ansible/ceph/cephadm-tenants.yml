---
# Provision each tenant's account, account-root user, quota, buckets and OIDC provider with
# underknowledge.ceph_rgw.rgw_tenants. Runs after cephadm-sts.yml, since it asserts STS auth
# is on. Account-root keys come from vault_rgw_tenants_<name>_access_key / _secret_key.
- name: Provision Ceph RGW tenants
  gather_facts: false
  hosts: mons
  become: true
  tags:
    - cephadm
    - cephadm-tenants
  tasks:
    - name: Apply Cephadm RGW multi-tenant configuration
      ansible.builtin.import_role:
        name: underknowledge.ceph_rgw.rgw_tenants
