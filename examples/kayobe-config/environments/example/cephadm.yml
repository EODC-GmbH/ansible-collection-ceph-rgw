---
# Merge into your kayobe environment's cephadm.yml. Secrets are in secrets.yml.example.

rgw_sts_key: "{{ vault_rgw_sts_key }}"

# Standalone AssumeRole / GetSessionToken roles. The web-identity tenant roles are rgw_iam's.
rgw_sts_roles: []

# service_name, bootstrap_host and fsid default to rgw.rgw, the first mon and
# /etc/ceph/ceph.conf. Override the service name if `ceph orch ls --service-type rgw` shows
# another:
# rgw_sts_service_name: "rgw.default"

rgw_tenants_endpoint: "http://ceph-rgw.internal.example:8080"

rgw_tenants_oidc:
  provider_url: "https://idp.example.com/realms/myrealm"
  client_ids: ["ceph-s3"]
  # The role rejects this placeholder. See "Compute the OIDC thumbprint" in the README.
  thumbprints: ["CHANGEME-40-hex-sha1-of-the-jwks-signing-cert"]

# The IAM role catalogue and capability bundles are rgw_iam's. Commonly overridden:
# rgw_iam_session_duration: 3600        # seconds, RGW bounds it 3600..43200
# rgw_iam_account_limits: {max_roles: 100}

# Gates, off by default except root user removal. Turn one on for a single run:
# rgw_tenants_rotate_keys: true
# rgw_tenants_allow_teardown: true     # act on state: absent entries
# rgw_tenants_allow_purge: true        # let purge_objects destroy data
# rgw_iam_prune: true                  # remove stale platform roles and stray policies
# rgw_tenants_allow_root_user_removal: false   # on by default; off keeps absent root_users

# account_id is "RGW" + 17 digits, unique and stable. max_size is in bytes or -1.
rgw_tenants_list:
  - name: aviato
    account_id: "RGW00000000000000001"
    buckets: ["aviato-data", "aviato-logs", "aviato-backups"]
    quota:
      enabled: true
      max_size: "{{ 500 * 1024 ** 3 }}" # 500 GiB
      max_objects: -1                    # no object-count cap
    limits:
      max_users: 20                      # -1 = unlimited
      max_buckets: 50
    # rotate_keys: true                  # roll this tenant's key once, after changing the vault key
    # access_keys:                       # more keys of the primary root user, each present or absent
    #   - access_key: AKAVIATOOLDKEY000001
    #     state: absent                    # removed on the next run
  - name: hooli
    account_id: "RGW00000000000000002"
    buckets: ["hooli-data", "hooli-logs"]
    # quota: omitted -> unlimited
    # limits: omitted -> rgw_iam_account_limits
    # root_user: gavinbelson
    # bucket_prefix: "hooli-"          # default "<name>-"

  # Decommission: see "Decommission a tenant" in the README.
  # - name: nucleus
  #   account_id: "RGW00000000000000003"
  #   state: absent
  #   buckets: ["nucleus-data"]        # listed so they get removed
  #   purge_objects: true              # only if the buckets still hold data (destructive)
